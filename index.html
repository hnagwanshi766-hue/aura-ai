<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1a0533" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Aura AI" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Aura — AI Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple: #7c3aed;
    --purple-dark: #6d28d9;
    --purple-deep: #1a0533;
    --navy: #0d1f3c;
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #222230;
    --border: rgba(255,255,255,0.08);
    --text: #f0eaff;
    --text-muted: rgba(210,190,255,0.6);
    --text-hint: rgba(180,160,240,0.4);
    --red: #dc2626;
    --blue: #0ea5e9;
    --green: #10b981;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(180deg, #12002a 0%, #0d1f3c 100%);
    padding: env(safe-area-inset-top, 20px) 20px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 280px; height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.25) 0%, transparent 65%);
    pointer-events: none;
  }

  .app-name {
    font-size: 26px;
    font-weight: 600;
    color: #e8d5ff;
    letter-spacing: 3px;
    position: relative;
    z-index: 1;
    margin-top: 8px;
  }

  .app-name span { color: var(--purple); }

  .tagline {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-weight: 300;
    position: relative;
    z-index: 1;
    margin-top: 4px;
  }

  /* ── MIC AREA ── */
  .mic-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 24px 0 16px;
    position: relative;
    z-index: 1;
  }

  .pulse-wrap {
    position: relative;
    width: 100px; height: 100px;
    display: flex; align-items: center; justify-content: center;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid rgba(167,139,250,0.3);
    animation: ring-out 2.4s ease-out infinite;
  }
  .ring:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
  .ring:nth-child(2) { width: 130%; height: 130%; animation-delay: 0.6s; }
  .ring:nth-child(3) { width: 160%; height: 160%; animation-delay: 1.2s; }

  @keyframes ring-out {
    0% { transform: scale(0.75); opacity: 0.7; }
    100% { transform: scale(1.1); opacity: 0; }
  }

  .mic-btn {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: linear-gradient(145deg, #7c3aed, #4338ca);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 2;
    box-shadow: 0 0 30px rgba(124,58,237,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
  }

  .mic-btn:active { transform: scale(0.93); }
  .mic-btn svg { width: 32px; height: 32px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .mic-btn.listening {
    background: linear-gradient(145deg, #dc2626, #991b1b);
    box-shadow: 0 0 35px rgba(220,38,38,0.55);
  }

  .mic-btn.thinking {
    background: linear-gradient(145deg, #0369a1, #075985);
    box-shadow: 0 0 35px rgba(14,165,233,0.45);
    animation: think-pulse 1s ease-in-out infinite;
  }

  @keyframes think-pulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.06)} }

  /* ── WAVEFORM ── */
  .waveform {
    display: flex; align-items: center; gap: 4px;
    height: 28px; margin: 10px 0 6px;
  }

  .waveform b {
    width: 3px; border-radius: 3px;
    background: rgba(167,139,250,0.55);
    display: block;
    animation: wave-idle 2s ease-in-out infinite;
  }
  .waveform b:nth-child(1){height:6px;animation-delay:0s}
  .waveform b:nth-child(2){height:12px;animation-delay:0.18s}
  .waveform b:nth-child(3){height:20px;animation-delay:0.36s}
  .waveform b:nth-child(4){height:12px;animation-delay:0.54s}
  .waveform b:nth-child(5){height:6px;animation-delay:0.72s}

  @keyframes wave-idle {
    0%,100%{transform:scaleY(1);opacity:0.4}
    50%{transform:scaleY(1.9);opacity:0.9}
  }

  .waveform.active b {
    background: #f87171;
    animation: wave-talk 0.35s ease-in-out infinite alternate;
  }
  .waveform.active b:nth-child(1){animation-delay:0s}
  .waveform.active b:nth-child(2){animation-delay:0.07s}
  .waveform.active b:nth-child(3){animation-delay:0.14s}
  .waveform.active b:nth-child(4){animation-delay:0.21s}
  .waveform.active b:nth-child(5){animation-delay:0.28s}
  @keyframes wave-talk{from{transform:scaleY(0.5)}to{transform:scaleY(3.5)}}

  .status-txt {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    min-height: 18px;
  }

  /* ── CHAT ── */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }

  .chat::-webkit-scrollbar { display: none; }

  .bubble {
    max-width: 84%;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 14px;
    line-height: 1.55;
    animation: pop-in 0.22s ease;
  }

  @keyframes pop-in {
    from { transform: translateY(8px) scale(0.97); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .bubble.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #7c3aed, #4338ca);
    color: #fff;
    border-bottom-right-radius: 5px;
  }

  .bubble.ai {
    align-self: flex-start;
    background: var(--surface);
    color: var(--text);
    border: 0.5px solid var(--border);
    border-bottom-left-radius: 5px;
  }

  .ai-label {
    font-size: 9px;
    font-weight: 600;
    color: var(--purple);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .dots { display:flex;gap:5px;padding:3px 0; }
  .dots s { width:7px;height:7px;border-radius:50%;background:var(--text-muted);animation:dot-bounce 1.2s ease-in-out infinite;text-decoration:none;display:block; }
  .dots s:nth-child(2){animation-delay:0.2s}
  .dots s:nth-child(3){animation-delay:0.4s}
  @keyframes dot-bounce{0%,100%{transform:translateY(0);opacity:0.3}50%{transform:translateY(-5px);opacity:1}}

  /* ── INPUT ── */
  .input-zone {
    flex-shrink: 0;
    padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
    background: var(--bg);
    border-top: 0.5px solid var(--border);
  }

  .input-row {
    display: flex; gap: 8px; align-items: center;
  }

  .txt-input {
    flex: 1;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 24px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    padding: 11px 16px;
    outline: none;
    -webkit-appearance: none;
  }

  .txt-input::placeholder { color: var(--text-hint); }
  .txt-input:focus { border-color: rgba(124,58,237,0.6); }

  .send-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--purple);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s, background 0.15s;
  }

  .send-btn:active { transform: scale(0.92); background: var(--purple-dark); }
  .send-btn svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .quick-row {
    display: flex; gap: 6px; margin-top: 10px;
    overflow-x: auto; padding-bottom: 2px;
  }
  .quick-row::-webkit-scrollbar { display: none; }

  .qbtn {
    white-space: nowrap;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 18px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
    -webkit-appearance: none;
  }

  .qbtn:active { background: var(--purple); color: white; }
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <div class="app-name">✦ <span>AURA</span></div>
    <div class="tagline">Your Personal AI Voice Assistant</div>

    <div class="mic-area">
      <div class="pulse-wrap">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <button class="mic-btn" id="micBtn" onclick="toggleMic()" aria-label="Microphone">
          <svg id="micIcon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
      </div>

      <div class="waveform" id="wave">
        <b></b><b></b><b></b><b></b><b></b>
      </div>
      <div class="status-txt" id="statusTxt">Mic dabao ya type karo</div>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="bubble ai">
      <div class="ai-label">Aura</div>
      Namaste! 🙏 Main hoon <strong>Aura</strong> — aapka personal AI assistant. Kuch bhi poochho — Hindi ya English, dono chalega!
    </div>
  </div>

  <div class="input-zone">
    <div class="input-row">
      <input class="txt-input" id="txtInput" type="text" placeholder="Kuch bhi poochho..." enterkeyhint="send" />
      <button class="send-btn" onclick="sendText()" aria-label="Send">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="quick-row">
      <button class="qbtn" onclick="sq('Mujhe aaj ka mausam batao')">🌤 Mausam</button>
      <button class="qbtn" onclick="sq('Ek motivational quote do')">💫 Quote</button>
      <button class="qbtn" onclick="sq('Mujhe ek joke sunao')">😄 Joke</button>
      <button class="qbtn" onclick="sq('Mujhe study tips batao')">📚 Study</button>
      <button class="qbtn" onclick="sq('Koi achhi recipe batao')">🍛 Recipe</button>
    </div>
  </div>

</div>

<script>
let isListening = false, recognition = null;
const history = [];
const micBtn = document.getElementById('micBtn');
const micIcon = document.getElementById('micIcon');
const wave = document.getElementById('wave');
const statusTxt = document.getElementById('statusTxt');
const chat = document.getElementById('chat');
const txtInput = document.getElementById('txtInput');

const MIC_SVG = '<rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>';
const STOP_SVG = '<rect x="6" y="6" width="12" height="12" rx="2"/>';
const SPIN_SVG = '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>';

function setUI(state, text) {
  statusTxt.textContent = text;
  micBtn.className = 'mic-btn ' + state;
  if (state === 'listening') { micIcon.innerHTML = STOP_SVG; wave.className = 'waveform active'; }
  else if (state === 'thinking') { micIcon.innerHTML = SPIN_SVG; wave.className = 'waveform'; }
  else { micIcon.innerHTML = MIC_SVG; wave.className = 'waveform'; }
}

function addBubble(text, role) {
  document.querySelector('.typing-ind')?.remove();
  const d = document.createElement('div');
  d.className = 'bubble ' + role;
  if (role === 'ai') d.innerHTML = '<div class="ai-label">Aura</div>' + text;
  else d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'bubble ai typing-ind';
  d.innerHTML = '<div class="ai-label">Aura</div><div class="dots"><s></s><s></s><s></s></div>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]*>/g,'').replace(/[🙏✦💫😄🌤📰📚🍛]/g,'');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = /[\u0900-\u097F]/.test(clean) ? 'hi-IN' : 'en-IN';
  u.rate = 0.95; u.pitch = 1.05;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(x=>x.lang==='hi-IN')||voices.find(x=>x.lang.startsWith('hi'))||voices.find(x=>x.lang==='en-IN');
  if (v) u.voice = v;
  u.onend = () => setUI('', 'Mic dabao ya type karo');
  u.onstart = () => setUI('', 'Bol rahi hoon...');
  window.speechSynthesis.speak(u);
}

async function ask(userText) {
  addBubble(userText, 'user');
  history.push({ role: 'user', content: userText });
  showTyping();
  setUI('thinking', 'Soch rahi hoon...');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: 'You are Aura, a warm helpful AI voice assistant. Reply in the same language the user uses — Hindi (Devanagari) if Hindi, English if English. Keep replies concise (2-4 sentences) since this is voice. Be friendly and helpful. No markdown, no asterisks, plain text only.',
        messages: history.slice(-10)
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Maafi karo, kuch galat ho gaya!';
    history.push({ role: 'assistant', content: reply });
    addBubble(reply, 'ai');
    speak(reply);
    setUI('', 'Mic dabao ya type karo');
  } catch {
    addBubble('Network problem! Dobara try karo.', 'ai');
    setUI('', 'Mic dabao ya type karo');
  }
}

function sendText() {
  const v = txtInput.value.trim();
  if (!v) return;
  txtInput.value = '';
  ask(v);
}

function sq(t) { ask(t); }

txtInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

function toggleMic() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    addBubble('Ye browser voice nahi karta. Text type karo!', 'ai'); return;
  }
  if (isListening) { recognition?.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'hi-IN';
  recognition.interimResults = false;
  recognition.onstart = () => { isListening = true; setUI('listening', 'Sun rahi hoon...'); };
  recognition.onresult = e => { isListening = false; ask(e.results[0][0].transcript); };
  recognition.onerror = e => {
    isListening = false; setUI('', 'Mic dabao ya type karo');
    if (e.error === 'not-allowed') addBubble('Mic permission do! Browser settings mein jaao.', 'ai');
  };
  recognition.onend = () => { isListening = false; };
  recognition.start();
}

window.speechSynthesis?.getVoices();
</script>
</body>
</html>
